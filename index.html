<!DOCTYPE html>
<html>
<head>
    <title>Firebase RTDB Debugger</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 50px; }
        #status { color: orange; font-weight: bold; }
        .success { color: green; }
        .error { color: red; }
        input { padding: 10px; width: 250px; margin: 10px; }
        button { padding: 10px 20px; cursor: pointer; background: #007bff; color: white; border: none; }
    </style>
</head>
<body>

    <h2>Firebase Connection Status: <span id="status">Connecting...</span></h2>
    <input type="text" id="msgInput" placeholder="Write something...">
    <button onclick="saveData()">Save to RTDB</button>
    
    <div id="display" style="margin-top:20px; border:1px solid #ccc; padding:10px; min-height:50px;"></div>

    <script type="module">
        import { initializeApp } from "https://gstatic.com";
        import { getDatabase, ref, push, onValue, set } from "https://gstatic.com";

        const firebaseConfig = {
            apiKey: "AIzaSyCLA40-3U1x5g1ejwg2C8iJ5iUPXYKu0d4",
            authDomain: "://firebaseapp.com",
            databaseURL: "https://firebaseio.com",
            projectId: "testing-289a9",
            storageBucket: "testing-289a9.firebasestorage.app",
            messagingSenderId: "884131704043",
            appId: "1:884131704043:web:4986837e0156a0550262ae"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Connection Check
        const connectedRef = ref(db, ".info/connected");
        onValue(connectedRef, (snap) => {
            const statusEl = document.getElementById('status');
            if (snap.val() === true) {
                statusEl.innerText = "Connected!";
                statusEl.className = "success";
            } else {
                statusEl.innerText = "Disconnected / Permission Denied";
                statusEl.className = "error";
            }
        });

        // Save Data Function
        window.saveData = function() {
            const text = document.getElementById('msgInput').value;
            const dataRef = ref(db, 'test_node');
            
            push(dataRef, { message: text, time: Date.now() })
            .then(() => {
                alert("Saved successfully!");
                document.getElementById('msgInput').value = "";
            })
            .catch((error) => {
                console.error("Save Error:", error);
                alert("Error: " + error.message);
            });
        }

        // Fetch Data
        onValue(ref(db, 'test_node'), (snapshot) => {
            const display = document.getElementById('display');
            display.innerHTML = "";
            snapshot.forEach((child) => {
                display.innerHTML += `<p>${child.val().message}</p>`;
            });
        });
    </script>
</body>
</html>
