<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firebase RTDB Demo</title>
    <style>
        body { font-family: sans-serif; padding: 20px; line-height: 1.6; }
        .container { max-width: 400px; margin: auto; border: 1px solid #ddd; padding: 20px; border-radius: 8px; }
        input { width: 100%; padding: 10px; margin-bottom: 10px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #007bff; color: white; border: none; cursor: pointer; }
        button:hover { background: #0056b3; }
        #dataList { margin-top: 20px; padding: 0; list-style: none; }
        #dataList li { background: #f4f4f4; margin-bottom: 5px; padding: 8px; border-radius: 4px; border-left: 5px solid #007bff; }
    </style>
</head>
<body>

<div class="container">
    <h3>Firebase RTDB Link</h3>
    <input type="text" id="userInput" placeholder="Kuch type karein...">
    <button id="saveBtn">Data Save Karein</button>

    <h4>Stored Data:</h4>
    <ul id="dataList"></ul>
</div>

<!-- Firebase SDK -->
<script type="module">
    import { initializeApp } from "https://gstatic.com";
    import { getDatabase, ref, push, onValue } from "https://gstatic.com";

    // Aapka Config
    const firebaseConfig = {
        apiKey: "AIzaSyCLA40-3U1x5g1ejwg2C8iJ5iUPXYKu0d4",
        authDomain: "testing-289a9.firebaseapp.com",
        databaseURL: "https://testing-289a9-default-rtdb.firebaseio.com",
        projectId: "testing-289a9",
        storageBucket: "testing-289a9.firebasestorage.app",
        messagingSenderId: "884131704043",
        appId: "1:884131704043:web:4986837e0156a0550262ae"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const dataRef = ref(db, 'messages');

    // UI Elements
    const inputField = document.getElementById('userInput');
    const saveBtn = document.getElementById('saveBtn');
    const dataList = document.getElementById('dataList');

    // 1. Data Save Karne Ke Liye
    saveBtn.addEventListener('click', () => {
        const value = inputField.value;
        if(value.trim() !== "") {
            push(dataRef, {
                text: value,
                timestamp: Date.now()
            });
            inputField.value = ""; // Clear input
        }
    });

    // 2. Data Fetch (Real-time)
    onValue(dataRef, (snapshot) => {
        dataList.innerHTML = ""; // List clear karein
        const data = snapshot.val();
        if (data) {
            Object.values(data).reverse().forEach(item => {
                const li = document.createElement('li');
                li.textContent = item.text;
                dataList.appendChild(li);
            });
        } else {
            dataList.innerHTML = "<li>No data found.</li>";
        }
    });
</script>

</body>
</html>
