<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clean Player</title>
    <style>
        body { margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; background: #111; }
        
        /* Video Container - iska overflow hidden hai taaki branding hide ho sake */
        .player-wrapper {
            position: relative;
            width: 800px;
            aspect-ratio: 16/9;
            overflow: hidden;
            border-radius: 8px;
        }

        /* Iframe ko thoda bada rakha hai taaki logo screen se bahar chala jaye */
        iframe {
            position: absolute;
            top: -50px; /* Top title bar hide karne ke liye */
            left: 0;
            width: 100%;
            height: calc(100% + 100px); /* Adjust height for masking */
            pointer-events: none; /* User direct YT controls click na kar paye */
        }

        /* Custom Play Button Overlay */
        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.4);
            display: flex; justify-content: center; align-items: center;
            cursor: pointer;
            z-index: 10;
        }

        .play-btn {
            width: 80px; height: 80px;
            background: #ff0000;
            border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            transition: transform 0.2s;
        }

        .play-btn::after {
            content: '';
            border-style: solid;
            border-width: 15px 0 15px 25px;
            border-color: transparent transparent transparent white;
            margin-left: 5px;
        }

        .overlay:hover .play-btn { transform: scale(1.1); }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="player-wrapper">
    <!-- Overlay with Play Button -->
    <div class="overlay" id="overlay" onclick="playVideo()">
        <div class="play-btn"></div>
    </div>

    <!-- YouTube Iframe -->
    <iframe id="videoFrame" 
        src="https://youtube.com" 
        frameborder="0" 
        allow="autoplay">
    </iframe>
</div>

<script>
    function playVideo() {
        const frame = document.getElementById('videoFrame');
        const overlay = document.getElementById('overlay');
        
        // YouTube API command to play video
        frame.contentWindow.postMessage('{"event":"command","func":"playVideo","args":""}', '*');
        
        // Hide overlay and enable interaction
        overlay.classList.add('hidden');
        frame.style.pointerEvents = 'auto';
    }
</script>

</body>
</html>
